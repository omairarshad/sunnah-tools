name: Build static site for Hostinger

on:
  push:
    branches:
      - feature/initial-site-and-tools
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger-live-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare world city directory from GeoNames
        run: npm run prepare:cities

      - name: Prepare AdSense seller authorisation file when configured
        env:
          PUBLIC_ADSENSE_PUBLISHER_ID: ${{ vars.ADSENSE_PUBLISHER_ID }}
        run: npm run prepare:ads

      - name: Run calculation tests
        run: npm test

      - name: Type-check Astro and React
        run: npm run check

      - name: Generate static website
        env:
          PUBLIC_ADSENSE_PUBLISHER_ID: ${{ vars.ADSENSE_PUBLISHER_ID }}
          PUBLIC_ADSENSE_ADS_ENABLED: ${{ vars.ADSENSE_ADS_ENABLED }}
          PUBLIC_ADSENSE_CMP_READY: ${{ vars.ADSENSE_CMP_READY }}
          PUBLIC_ADSENSE_HOME_SLOT: ${{ vars.ADSENSE_HOME_SLOT }}
          PUBLIC_ADSENSE_TOOL_SLOT: ${{ vars.ADSENSE_TOOL_SLOT }}
        run: npm run build

      - name: Audit generated interface and every tool route
        run: node scripts/audit-site.mjs

      - name: Check deployable homepage exists
        shell: bash
        run: |
          test -s dist/index.html
          test -s dist/tools/prayer-times/index.html
          test -s dist/tools/zakat-calculator/index.html
          test -s dist/tools/gold-zakat-calculator/index.html
          test -s dist/tools/fasting-times/index.html
          test -s dist/tools/islamic-events-calendar/index.html
          test -s dist/tools/printable-prayer-chart/index.html
          test -s dist/data/cities.json
          test $(wc -c < dist/data/cities.json) -gt 900000
          grep -q 'Europe/London' dist/data/cities.json
          test -s dist/tools/white-days-calendar/index.html
          test -s dist/tools/printable-hijri-calendar/index.html
          test -s dist/tools/prayer-times-widget/index.html
          test -s dist/tools/umrah-packing-checklist/index.html
          test -s dist/embed/prayer-times/index.html
          test -s dist/sitemap-0.xml
          grep -q 'white-days-calendar' dist/sitemap-0.xml
          grep -q 'printable-hijri-calendar' dist/sitemap-0.xml
          grep -q 'prayer-times-widget' dist/sitemap-0.xml
          grep -q 'umrah-packing-checklist' dist/sitemap-0.xml
          grep -q 'gold-zakat-calculator' dist/sitemap-0.xml
          grep -q 'fasting-times' dist/sitemap-0.xml
          grep -q 'islamic-events-calendar' dist/sitemap-0.xml
          grep -q 'printable-prayer-chart' dist/sitemap-0.xml
          test -f dist/robots.txt

      - name: Publish generated files to Hostinger branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          git init --initial-branch=hostinger-live
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "site: static build from ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/hostinger-live

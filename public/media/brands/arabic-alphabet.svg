<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
<title id="title">Arabic Alphabet — interactive learning banner</title><desc id="desc">Branded learning illustration with colourful flashcards showing Alif, Baa and Taa, and audio pronunciation symbols.</desc>
